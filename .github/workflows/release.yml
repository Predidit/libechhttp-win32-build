name: Build and verify dependency SDKs
on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
          - target: windows-arm64
            runner: windows-2022
          - target: windows-ia32
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++-11
      - if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Build, link-check, and package
        run: python build.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  verify:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: build-*
          merge-multiple: true
      - name: Verify all target archives and source commit
        run: |
          tag=$(python -c 'import json; print(json.load(open("dependencies.json"))["release"])')
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then tag="$GITHUB_REF_NAME"; fi
          python verify_release.py "$tag" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-sdks
          path: dist/*
          if-no-files-found: error
