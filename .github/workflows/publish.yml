name: Publish verified SDK artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag matching the SDK manifest
        required: true
        type: string
      run_id:
        description: Successful SDK build run at the tagged commit
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify artifact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)"
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify and publish without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          python verify_release.py "$TAG"
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file RELEASE_NOTES.md
